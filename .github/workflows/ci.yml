name: CI

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    name: Lint + typecheck + tests + gen-check
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/astral-sh/uv:0.7.0-bookworm-slim
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: /root/.cache/uv
        key: uv-${{ hashFiles('pyproject.toml') }}
    - name: Install SDK (editable + dev)
      run: uv sync --extra dev
    - name: No committed build artifacts (SDK-001)
      run: |
        hits=$(git ls-files | grep -E '(^|/)dist/|\.egg-info/|__pycache__/|\.pyc$' || true)
        if [ -n "$hits" ]; then
          echo "Committed build artifacts found:"; echo "$hits"
          echo "Remove them and rely on .gitignore (dist/, *.egg-info/, __pycache__/)."
          exit 1
        else
          echo "clean: no build artifacts tracked in git"
        fi
    - name: Lint (ruff)
      run: make lint
    - name: Typecheck (mypy --strict)
      run: make typecheck
    - name: Test (pytest)
      run: make test
    - name: Build wheel + sdist
      run: make build

  gen-check:
    name: Verify committed proto stubs are current
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/astral-sh/uv:0.7.0-bookworm-slim
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Checkout Acadia-HAL (proto source)
      uses: actions/checkout@v4
      with:
        repository: soccentric-acadia/Acadia-HAL
        path: ../Acadia-HAL
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install
      run: uv sync
    - name: Run gen-check
      run: make gen-check

  docker-build:
    name: Build Docker image (wheel)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: false
        load: true
        tags: acadia-pysdk:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

  wire-compat:
    name: Real Server ↔ PySDK wire-compat (task 100)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        path: pysdk
    - uses: actions/checkout@v4
      with:
        repository: soccentric-acadia/Acadia-HAL
        path: Acadia-HAL
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/checkout@v4
      with:
        repository: soccentric-acadia/Acadia-Server
        path: server
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build + start real C++ Server
      working-directory: server
      run: |
        cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
        ninja -C build -j$(nproc) acadia-server
        # Start with default settings (Postgres optional; Server should still bind gRPC).
        nohup ./build/acadia-server > /tmp/server.log 2>&1 &
        sleep 5
    - name: Install PySDK + run wire-compat
      working-directory: pysdk
      run: |
        uv sync --extra dev
        ACADIA_SERVER_ADDR=127.0.0.1:50051 .venv/bin/python tests/wire_compat.py
    - name: Dump server log on failure
      if: failure()
      run: tail -c 8000 /tmp/server.log
