name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch Acadia-HAL alongside PySDK for proto generation
          fetch-depth: 1

      - name: Checkout Acadia-HAL (for protos)
        uses: actions/checkout@v4
        with:
          repository: SiliconCentric/Acadia-HAL
          path: ../Acadia-HAL
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup venv
        run: make setup

      - name: gen-check (stubs must not be stale)
        run: make gen-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test
